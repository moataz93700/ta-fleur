<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="TA FLEUR — Monogramme">
  <defs>
    <!-- Cercle de fond — fond blanc -->
    <clipPath id="circleClip">
      <circle cx="110" cy="110" r="103"/>
    </clipPath>

    <!-- Gradient or pour le cercle border -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8D5B0"/>
      <stop offset="35%"  stop-color="#C9A96E"/>
      <stop offset="65%"  stop-color="#E8D5B0"/>
      <stop offset="100%" stop-color="#9A7235"/>
    </linearGradient>

    <!-- Ombre douce -->
    <filter id="monogramShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A1A1A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ombre extérieure -->
  <circle cx="110" cy="112" r="103" fill="#1A1A1A" opacity="0.08" filter="url(#monogramShadow)"/>

  <!-- Fond du cercle -->
  <circle cx="110" cy="110" r="103" fill="#1A1A1A"/>

  <!-- Cercle border or double -->
  <circle cx="110" cy="110" r="103" fill="none" stroke="url(#goldBorder)" stroke-width="1.5"/>
  <circle cx="110" cy="110" r="97"  fill="none" stroke="url(#goldBorder)" stroke-width="0.5" opacity="0.5"/>

  <!-- ══════════════════════════
       ROSE DÉCORATIVE (version or sur fond sombre)
  ══════════════════════════ -->
  <g transform="translate(110, 68)">

    <!-- Pétales extérieurs (5) — or clair -->
    <path d="M0,-26 C6,-31 13,-23 11,-14 C9,-6 2,-2 0,0 C-2,-2 -9,-6 -11,-14 C-13,-23 -6,-31 0,-26Z"
          fill="#C9A96E" opacity="0.5"/>
    <path transform="rotate(72,0,0)"
          d="M0,-26 C6,-31 13,-23 11,-14 C9,-6 2,-2 0,0 C-2,-2 -9,-6 -11,-14 C-13,-23 -6,-31 0,-26Z"
          fill="#C9A96E" opacity="0.5"/>
    <path transform="rotate(144,0,0)"
          d="M0,-26 C6,-31 13,-23 11,-14 C9,-6 2,-2 0,0 C-2,-2 -9,-6 -11,-14 C-13,-23 -6,-31 0,-26Z"
          fill="#C9A96E" opacity="0.5"/>
    <path transform="rotate(216,0,0)"
          d="M0,-26 C6,-31 13,-23 11,-14 C9,-6 2,-2 0,0 C-2,-2 -9,-6 -11,-14 C-13,-23 -6,-31 0,-26Z"
          fill="#C9A96E" opacity="0.5"/>
    <path transform="rotate(288,0,0)"
          d="M0,-26 C6,-31 13,-23 11,-14 C9,-6 2,-2 0,0 C-2,-2 -9,-6 -11,-14 C-13,-23 -6,-31 0,-26Z"
          fill="#C9A96E" opacity="0.5"/>

    <!-- Pétales médians (5, +36°) — or medium -->
    <path transform="rotate(36,0,0)"
          d="M0,-18 C4,-21 8,-16 7,-10 C5,-4 2,-1 0,0 C-2,-1 -5,-4 -7,-10 C-8,-16 -4,-21 0,-18Z"
          fill="#C9A96E" opacity="0.75"/>
    <path transform="rotate(108,0,0)"
          d="M0,-18 C4,-21 8,-16 7,-10 C5,-4 2,-1 0,0 C-2,-1 -5,-4 -7,-10 C-8,-16 -4,-21 0,-18Z"
          fill="#C9A96E" opacity="0.75"/>
    <path transform="rotate(180,0,0)"
          d="M0,-18 C4,-21 8,-16 7,-10 C5,-4 2,-1 0,0 C-2,-1 -5,-4 -7,-10 C-8,-16 -4,-21 0,-18Z"
          fill="#C9A96E" opacity="0.75"/>
    <path transform="rotate(252,0,0)"
          d="M0,-18 C4,-21 8,-16 7,-10 C5,-4 2,-1 0,0 C-2,-1 -5,-4 -7,-10 C-8,-16 -4,-21 0,-18Z"
          fill="#C9A96E" opacity="0.75"/>
    <path transform="rotate(324,0,0)"
          d="M0,-18 C4,-21 8,-16 7,-10 C5,-4 2,-1 0,0 C-2,-1 -5,-4 -7,-10 C-8,-16 -4,-21 0,-18Z"
          fill="#C9A96E" opacity="0.75"/>

    <!-- Pétales intérieurs (3) -->
    <path d="M0,-11 C3,-13 6,-9 5,-5 C3,-2 1,0 0,0 C-1,0 -3,-2 -5,-5 C-6,-9 -3,-13 0,-11Z"
          fill="#E8D5B0"/>
    <path transform="rotate(120,0,0)"
          d="M0,-11 C3,-13 6,-9 5,-5 C3,-2 1,0 0,0 C-1,0 -3,-2 -5,-5 C-6,-9 -3,-13 0,-11Z"
          fill="#E8D5B0"/>
    <path transform="rotate(240,0,0)"
          d="M0,-11 C3,-13 6,-9 5,-5 C3,-2 1,0 0,0 C-1,0 -3,-2 -5,-5 C-6,-9 -3,-13 0,-11Z"
          fill="#E8D5B0"/>

    <!-- Centre -->
    <circle r="5.5" fill="#E8D5B0"/>
    <circle r="3.5" fill="#C9A96E"/>
    <circle r="1.5" fill="#1A1A1A"/>
  </g>

  <!-- ══════════════════════════
       "TA" sur fond sombre — en or
  ══════════════════════════ -->
  <text
    x="110"
    y="168"
    font-family="'Playfair Display', Georgia, serif"
    font-size="108"
    font-weight="700"
    fill="#C9A96E"
    text-anchor="middle"
    letter-spacing="-2"
  >TA</text>

  <!-- Ligne or sous TA -->
  <line x1="54" y1="180" x2="166" y2="180"
        stroke="#C9A96E" stroke-width="0.5" opacity="0.6"/>

  <!-- "FLEUR" sous la ligne -->
  <text
    x="110"
    y="196"
    font-family="'Montserrat', 'Helvetica Neue', sans-serif"
    font-size="10"
    font-weight="300"
    fill="#C9A96E"
    text-anchor="middle"
    letter-spacing="7"
    opacity="0.8"
  >FLEUR</text>

</svg>
