<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-label="TA FLEUR — Fleurs &amp; Émotions">
  <defs>
    <!-- Gradient rose pour la fleur -->
    <radialGradient id="roseGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#B85C74"/>
      <stop offset="40%"  stop-color="#D4748C"/>
      <stop offset="100%" stop-color="#F2B5C5"/>
    </radialGradient>

    <!-- Gradient or pour accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8D5B0"/>
      <stop offset="50%"  stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#9A7235"/>
    </linearGradient>

    <!-- Filtre ombre douce pour les lettres -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1A1A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ══════════════════════════
       ROSE DÉCORATIVE
       Positionnée entre les 2 lettres,
       légèrement chevauchant le haut du T et du A
  ══════════════════════════ -->
  <g transform="translate(180, 72)">

    <!-- Feuilles -->
    <path d="M-6,28 C-16,20 -22,8 -13,3 C-8,0 -5,9 -5,22Z"
          fill="#A8C9A0" opacity="0.75"/>
    <path d="M6,28 C16,20 22,8 13,3 C8,0 5,9 5,22Z"
          fill="#A8C9A0" opacity="0.75"/>

    <!-- Pétales extérieurs (5) — rose clair -->
    <path d="M0,-32 C8,-38 16,-28 14,-17 C12,-7 3,-2 0,0 C-3,-2 -12,-7 -14,-17 C-16,-28 -8,-38 0,-32Z"
          fill="#FAD4E0"/>
    <path transform="rotate(72,0,0)"
          d="M0,-32 C8,-38 16,-28 14,-17 C12,-7 3,-2 0,0 C-3,-2 -12,-7 -14,-17 C-16,-28 -8,-38 0,-32Z"
          fill="#FAD4E0"/>
    <path transform="rotate(144,0,0)"
          d="M0,-32 C8,-38 16,-28 14,-17 C12,-7 3,-2 0,0 C-3,-2 -12,-7 -14,-17 C-16,-28 -8,-38 0,-32Z"
          fill="#FAD4E0"/>
    <path transform="rotate(216,0,0)"
          d="M0,-32 C8,-38 16,-28 14,-17 C12,-7 3,-2 0,0 C-3,-2 -12,-7 -14,-17 C-16,-28 -8,-38 0,-32Z"
          fill="#FAD4E0"/>
    <path transform="rotate(288,0,0)"
          d="M0,-32 C8,-38 16,-28 14,-17 C12,-7 3,-2 0,0 C-3,-2 -12,-7 -14,-17 C-16,-28 -8,-38 0,-32Z"
          fill="#FAD4E0"/>

    <!-- Pétales médians (5, décalés de 36°) — rose pastel -->
    <path transform="rotate(36,0,0)"
          d="M0,-22 C5,-26 10,-19 9,-12 C7,-5 2,-1 0,0 C-2,-1 -7,-5 -9,-12 C-10,-19 -5,-26 0,-22Z"
          fill="#F2B5C5"/>
    <path transform="rotate(108,0,0)"
          d="M0,-22 C5,-26 10,-19 9,-12 C7,-5 2,-1 0,0 C-2,-1 -7,-5 -9,-12 C-10,-19 -5,-26 0,-22Z"
          fill="#F2B5C5"/>
    <path transform="rotate(180,0,0)"
          d="M0,-22 C5,-26 10,-19 9,-12 C7,-5 2,-1 0,0 C-2,-1 -7,-5 -9,-12 C-10,-19 -5,-26 0,-22Z"
          fill="#F2B5C5"/>
    <path transform="rotate(252,0,0)"
          d="M0,-22 C5,-26 10,-19 9,-12 C7,-5 2,-1 0,0 C-2,-1 -7,-5 -9,-12 C-10,-19 -5,-26 0,-22Z"
          fill="#F2B5C5"/>
    <path transform="rotate(324,0,0)"
          d="M0,-22 C5,-26 10,-19 9,-12 C7,-5 2,-1 0,0 C-2,-1 -7,-5 -9,-12 C-10,-19 -5,-26 0,-22Z"
          fill="#F2B5C5"/>

    <!-- Pétales intérieurs (3) — rose profond -->
    <path d="M0,-14 C3,-16 7,-12 6,-7 C4,-2 1,0 0,0 C-1,0 -4,-2 -6,-7 C-7,-12 -3,-16 0,-14Z"
          fill="#D4748C"/>
    <path transform="rotate(120,0,0)"
          d="M0,-14 C3,-16 7,-12 6,-7 C4,-2 1,0 0,0 C-1,0 -4,-2 -6,-7 C-7,-12 -3,-16 0,-14Z"
          fill="#D4748C"/>
    <path transform="rotate(240,0,0)"
          d="M0,-14 C3,-16 7,-12 6,-7 C4,-2 1,0 0,0 C-1,0 -4,-2 -6,-7 C-7,-12 -3,-16 0,-14Z"
          fill="#D4748C"/>

    <!-- Centre en couches -->
    <circle r="6.5" fill="#D4748C"/>
    <circle r="4.5" fill="#B85C74"/>
    <circle r="2.5" fill="#8B3A52"/>
    <circle r="1"   fill="#FAD4E0" opacity="0.6"/>
  </g>

  <!-- ══════════════════════════
       MONOGRAMME "TA"
       Playfair Display Bold — corps 178px
       Ancre : baseline à y=200
  ══════════════════════════ -->
  <text
    x="180"
    y="200"
    font-family="'Playfair Display', Georgia, serif"
    font-size="178"
    font-weight="700"
    fill="#1A1A1A"
    text-anchor="middle"
    letter-spacing="-4"
    filter="url(#softShadow)"
  >TA</text>

  <!-- ══════════════════════════
       "FLEUR" — tracé élégant
       Montserrat Light — tracking luxe
  ══════════════════════════ -->
  <text
    x="180"
    y="240"
    font-family="'Montserrat', 'Helvetica Neue', sans-serif"
    font-size="21"
    font-weight="300"
    fill="#1A1A1A"
    text-anchor="middle"
    letter-spacing="18"
  >FLEUR</text>

  <!-- Ligne décorative or — symbole de qualité -->
  <line x1="78" y1="254" x2="282" y2="254"
        stroke="#C9A96E" stroke-width="0.6" opacity="0.8"/>

  <!-- Petits losanges décoratifs aux extrémités de la ligne -->
  <polygon points="78,254 82,250 86,254 82,258" fill="#C9A96E" opacity="0.7"/>
  <polygon points="274,254 278,250 282,254 278,258" fill="#C9A96E" opacity="0.7"/>

  <!-- ══════════════════════════
       TAGLINE
       Poppins Light — ultra tracé
  ══════════════════════════ -->
  <text
    x="180"
    y="273"
    font-family="'Poppins', system-ui, sans-serif"
    font-size="8.5"
    font-weight="300"
    fill="#6B6B6B"
    text-anchor="middle"
    letter-spacing="5"
  >FLEURS &amp; ÉMOTIONS</text>

</svg>
