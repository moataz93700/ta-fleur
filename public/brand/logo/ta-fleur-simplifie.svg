<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" role="img" aria-label="TA FLEUR">
  <!-- "TA" — grande partie du logo simplifié -->
  <text
    x="0"
    y="58"
    font-family="'Playfair Display', Georgia, serif"
    font-size="66"
    font-weight="700"
    fill="#1A1A1A"
    letter-spacing="-2"
  >TA</text>

  <!-- Séparateur vertical or -->
  <line x1="102" y1="10" x2="102" y2="68"
        stroke="#C9A96E" stroke-width="0.8" opacity="0.7"/>

  <!-- "FLEUR" à droite du séparateur -->
  <text
    x="116"
    y="38"
    font-family="'Montserrat', 'Helvetica Neue', sans-serif"
    font-size="13.5"
    font-weight="400"
    fill="#1A1A1A"
    letter-spacing="5"
  >FLEUR</text>

  <!-- Tagline sous FLEUR -->
  <text
    x="116"
    y="56"
    font-family="'Montserrat', 'Helvetica Neue', sans-serif"
    font-size="7.5"
    font-weight="300"
    fill="#6B6B6B"
    letter-spacing="3"
  >FLEURS &amp; ÉMOTIONS</text>

</svg>
